[package]
name = "comtec-desktop"
version = "0.1.0"
edition = "2021"
[lib]
name = "comtec_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
mp4-atom = "0.15"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls"]
